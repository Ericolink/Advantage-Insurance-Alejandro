# Netlify detects Next.js and adds its runtime automatically:
# static pages, the language redirect (src/proxy.ts) and the form's server action all work.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# ── CLIENT REVIEW STAGE (current) ───────────────────────────────────────────
# Shows "pending" markers and draft data so Alejandro can review everything.
# The site is never indexable in this mode.
[context.production.environment]
  NEXT_PUBLIC_SHOW_PENDING = "1"
  # AT LAUNCH: delete the line above and uncomment the next one, so the build
  # refuses to publish while blocking items remain (see `npm run check:launch`).
  # REQUIRE_LAUNCH_READY = "1"

[context.deploy-preview.environment]
  NEXT_PUBLIC_SHOW_PENDING = "1"

[context.branch-deploy.environment]
  NEXT_PUBLIC_SHOW_PENDING = "1"
